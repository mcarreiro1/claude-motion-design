<!doctype html>
<html><head><meta charset="utf-8"><title>Freerange: Pix and Yolk</title>
<style>
html,body{margin:0;background:#111}
#stage{display:block;width:1080px;height:1920px}
body.preview #stage{width:auto;height:96vh;margin:2vh auto}
#hud{position:fixed;left:8px;top:8px;color:#ddd;font:12px monospace;display:none}
body.preview #hud{display:block}
</style></head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<svg width="0" height="0" style="position:absolute">
  <filter id="boil0" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="boil1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="boil2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div id="hud"></div>
<script>
// FREERANGE: PIX & YOLK. 30 s, 1080x1920, six shots. Everything is drawn from seek(t).
// Stop-motion look: poses are held on twos (12 poses/s inside a 24 fps file) with a seeded per-pose "boil".
const W = 1080, H = 1920, T = 30, SFPS = 12;
const LIME = '#c6ff3d';
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas'); bg.width = W; bg.height = H; const bctx = bg.getContext('2d');
const ch = document.createElement('canvas'); ch.width = W; ch.height = H; const cctx = ch.getContext('2d');

// ---------- math ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,u)=>a+(b-a)*u;
const seg = (t,a,b)=>clamp((t-a)/(b-a));
const io = u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const out = u=>1-Math.pow(1-u,3);
const sm = (t,a,b)=>io(seg(t,a,b));
const TAU = Math.PI*2;
// closed-form damped spring step response (0 before t0, settles to 1)
function spring(t,t0,f=2.5,z=0.5){const x=t-t0;if(x<=0)return 0;const w=TAU*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*x)*(Math.cos(wd*x)+z*w/wd*Math.sin(wd*x));}
// value that springs between keyed targets: keys [[t,v],...]
function springKeys(t,keys,f=2.5,z=0.5){let v=keys[0][1];for(let i=1;i<keys.length;i++)v+=(keys[i][1]-keys[i-1][1])*spring(t,keys[i][0],f,z);return v;}
function easeKeys(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0])return lerp(keys[i-1][1],keys[i][1],io(seg(t,keys[i-1][0],keys[i][0])));}return keys[keys.length-1][1];}

// ---------- clay texture (thumbprints, smudges, grain) ----------
function makeTex(seed,size=1024){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const r=mulberry32(seed);
  g.fillStyle='rgb(128,128,128)';g.fillRect(0,0,size,size);
  for(let i=0;i<70;i++){const x=r()*size,y=r()*size,rad=30+r()*130,l=r()<.5?0:255;const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(${l},${l},${l},0.12)`);gr.addColorStop(1,`rgba(${l},${l},${l},0)`);g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2);}
  for(let p=0;p<26;p++){
    const cx=r()*size,cy=r()*size,rot=r()*Math.PI,rings=7+Math.floor(r()*9),sy=0.65+r()*0.3;
    g.save();g.translate(cx,cy);g.rotate(rot);g.scale(1,sy);
    for(let k=0;k<rings;k++){const rad=5+k*4.4,a0=r()*TAU,len=Math.PI*(0.5+r()*1.3);
      g.lineWidth=1.8;g.strokeStyle='rgba(0,0,0,0.26)';g.beginPath();g.arc(0,0,rad,a0,a0+len);g.stroke();
      g.lineWidth=1.4;g.strokeStyle='rgba(255,255,255,0.22)';g.beginPath();g.arc(0,-1.5,rad,a0,a0+len);g.stroke();}
    g.restore();}
  for(let i=0;i<160;i++){const x=r()*size,y=r()*size,l=r()*18+4,a=r()*Math.PI;g.strokeStyle=r()<.5?'rgba(0,0,0,0.14)':'rgba(255,255,255,0.14)';g.lineWidth=1+r()*2.5;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  const id=g.getImageData(0,0,size,size),d=id.data;for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*30;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}g.putImageData(id,0,0);
  return c;}
function makeGrain(seed){const c=document.createElement('canvas');c.width=540;c.height=960;const g=c.getContext('2d');const id=g.createImageData(540,960),d=id.data,r=mulberry32(seed);
  for(let i=0;i<d.length;i+=4){const v=128+(r()-0.5)*90;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}g.putImageData(id,0,0);return c;}
let TEX,texPat,GRAIN=[];
let TJ={x:0,y:0}; // per-pose texture jitter (clay gets re-handled between poses)

// paint a clay blob: base fill + soft rim darkening + key light + bottom occlusion + thumbprint overlay
function clay(g,path,col,box,o={}){
  g.save();g.beginPath();path(g);g.fillStyle=col;g.fill();g.clip();
  const {x,y,w,h}=box,cx=x+w/2,cy=y+h/2,R=Math.max(w,h)*0.62;
  let gr=g.createRadialGradient(cx-w*0.1,cy-h*0.14,R*0.3,cx,cy,R*1.05);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(25,10,0,${o.rim??0.36})`);g.fillStyle=gr;g.fillRect(x-8,y-8,w+16,h+16);
  gr=g.createRadialGradient(x+w*0.3,y+h*0.22,0,x+w*0.3,y+h*0.22,R*0.8);
  gr.addColorStop(0,`rgba(255,250,236,${o.hi??0.3})`);gr.addColorStop(1,'rgba(255,250,236,0)');g.fillStyle=gr;g.fillRect(x-8,y-8,w+16,h+16);
  gr=g.createLinearGradient(0,y+h*0.5,0,y+h);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(25,10,0,${o.bot??0.2})`);g.fillStyle=gr;g.fillRect(x-8,y-8,w+16,h+16);
  g.globalCompositeOperation='overlay';g.globalAlpha=o.tex??0.6;
  texPat.setTransform(new DOMMatrix().translateSelf(TJ.x+(o.tx||0),TJ.y+(o.ty||0)).scaleSelf(o.ts||0.45));
  g.fillStyle=texPat;g.fillRect(x-8,y-8,w+16,h+16);
  g.restore();}
const ell=(x,y,rx,ry,a=0)=>g=>g.ellipse(x,y,rx,ry,a,0,TAU);
const rr=(x,y,w,h,r)=>g=>g.roundRect(x,y,w,h,r);
function groundShadow(g,x,y,rx,a){g.save();g.translate(x,y);g.scale(1,0.22);const gr=g.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,`rgba(70,35,5,${a})`);gr.addColorStop(0.6,`rgba(70,35,5,${a*0.5})`);gr.addColorStop(1,'rgba(70,35,5,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,rx,0,TAU);g.fill();g.restore();}

// ---------- the set ----------
const F = 1260; // desk front edge (world y)
const deskY = (d,k)=>F-d*220*k; // a point on the desk top at depth d (0 front, 1 back)
function flat(g,x,d,k,rot,th,top,side,w,h,r){ // flat clay slab lying on the desk (sticky note, laptop base)
  g.save();g.translate(x,deskY(d,k));
  g.save();g.translate(0,th);g.scale(1,0.42*k+0.05);g.rotate(rot);g.beginPath();g.roundRect(-w/2,-h/2,w,h,r);g.fillStyle=side;g.fill();g.restore();
  g.save();g.scale(1,0.42*k+0.05);g.rotate(rot);clay(g,rr(-w/2,-h/2,w,h,r),top,{x:-w/2,y:-h/2,w,h},{rim:.22,hi:.32,tex:.5,ts:.35});g.restore();
  g.restore();}
function drawSet(g,k){
  const B=deskY(1,k),TH=72;
  // floor contact shadow under the desk
  g.save();g.translate(540,1838);g.scale(1,0.09);const gr=g.createRadialGradient(0,0,0,0,0,600);gr.addColorStop(0,'rgba(60,110,0,0.38)');gr.addColorStop(1,'rgba(60,110,0,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,600,0,TAU);g.fill();g.restore();
  const wood='#c87a3e',woodTop='#d18649',woodSide='#b76a30',cream='#ecd29b';
  // back legs
  for(const x of [165,915]) clay(g,rr(x-26,B+40,52,1770-B-40,26),'#ad622b',{x:x-26,y:B+40,w:52,h:1770-B-40},{rim:.45,hi:.1});
  // drawer cabinet
  clay(g,rr(585,F+40,300,1750-F-40,14),woodSide,{x:585,y:F+40,w:300,h:1750-F-40},{rim:.3});
  for(const [y0,y1] of [[F+80,F+270],[F+290,F+480]]){
    clay(g,rr(605,y0,260,y1-y0,22),cream,{x:605,y:y0,w:260,h:y1-y0},{rim:.25,hi:.3});
    const ky=(y0+y1)/2;groundShadow(g,740,ky+30,40,0.25);clay(g,ell(735,ky,26,26),'#c06f34',{x:709,y:ky-26,w:52,h:52},{hi:.4,rim:.3,ts:.3});}
  // front legs
  for(const x of [80,1000]) clay(g,rr(x-34,F+30,68,1830-F-30,34),wood,{x:x-34,y:F+30,w:68,h:1830-F-30},{rim:.38,hi:.25});
  clay(g,rr(870-30,F+30,60,1830-F-30,30),wood,{x:840,y:F+30,w:60,h:1830-F-30},{rim:.38,hi:.25});
  // slab: front face then top
  clay(g,rr(28,F-40,1024,TH+40,38),woodSide,{x:28,y:F-40,w:1024,h:TH+40},{rim:.25,hi:.15,bot:.3});
  const top=g=>{const p=[[28,F],[1052,F],[990,B],[90,B]],r=40;g.moveTo((p[0][0]+p[1][0])/2,F);
    for(let i=1;i<=4;i++){const a=p[i%4],b=p[(i+1)%4];g.arcTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2,r*(0.4+0.6*k));}g.closePath();};
  clay(g,top,woodTop,{x:28,y:B,w:1024,h:F-B},{rim:.18,hi:.22,bot:.05,ts:.6});
  g.save();g.strokeStyle='rgba(255,235,200,0.35)';g.lineWidth=3;g.beginPath();g.moveTo(70,F+1);g.lineTo(1010,F+1);g.stroke();g.restore();
  // props, back to front
  drawMug(g,752,0.66,k);
  flat(g,972,0.68,k,0.12,10,'#f6a03c','#d97f22',100,92,14);
  // laptop
  const ld=0.44,ly=deskY(ld,k),back=ly-100*(0.42*k+0.05);
  groundShadow(g,545,ly+8,190,0.35);
  clay(g,rr(397,back-268,296,272,26),'#8e8a8f',{x:397,y:back-268,w:296,h:272},{rim:.3,hi:.25});
  clay(g,rr(419,back-246,252,214,14),'#4d4a4b',{x:419,y:back-246,w:252,h:214},{rim:.35,hi:.12,tex:.35});
  flat(g,545,ld,k,0,16,'#9a969b','#77737a',320,200,28);
  g.save();g.translate(545,ly);g.scale(1,0.42*k+0.05);
  for(let rI=0;rI<3;rI++)for(let c=0;c<7;c++){const x=-126+c*36,y=-78+rI*34;clay(g,rr(x,y,28,24,7),'#59565a',{x,y,w:28,h:24},{rim:.3,hi:.15,tex:.3});}
  clay(g,rr(-70,24,140,24,8),'#59565a',{x:-70,y:24,w:140,h:24},{rim:.3,hi:.15,tex:.3});
  g.restore();
  // sticky notes left (pink on orange) and right front (blue)
  flat(g,168,0.5,k,0.1,10,'#f7a23e','#d98123',104,92,14);
  flat(g,200,0.6,k,-0.16,11,'#f394a6','#d4728a',112,98,16);
  flat(g,556,0.06,k,-0.08,10,'#a6dcd8','#7fb9b5',98,90,14);
}
function drawMug(g,x,d,k){
  const y=deskY(d,k),eh=10+12*k;
  groundShadow(g,x+6,y+4,80,0.4);
  g.save();g.strokeStyle='#e4d1ad';g.lineWidth=20;g.lineCap='round';g.beginPath();g.arc(x+58,y-62,28,-1.3,1.3);g.stroke();
  g.strokeStyle='rgba(255,255,255,0.3)';g.lineWidth=5;g.beginPath();g.arc(x+58,y-66,30,-1.1,0.6);g.stroke();g.restore();
  clay(g,g=>{g.moveTo(x-54,y-118);g.lineTo(x-52,y-14);g.quadraticCurveTo(x-50,y+eh*0.6,x,y+eh*0.6);g.quadraticCurveTo(x+50,y+eh*0.6,x+52,y-14);g.lineTo(x+54,y-118);g.closePath();},'#efe0c3',{x:x-54,y:y-118,w:108,h:118+eh},{rim:.3,hi:.35});
  clay(g,ell(x,y-118,54,eh),'#f6ead2',{x:x-54,y:y-118-eh,w:108,h:eh*2},{rim:.1,hi:.3,tex:.3});
  clay(g,ell(x,y-116,43,eh*0.72),'#7b4a2c',{x:x-43,y:y-116-eh,w:86,h:eh*1.5},{rim:.4,hi:.15,tex:.25});
}

// ---------- PIX: chunky matte black clay chicken, five-point red comb ----------
// local units: origin = between the feet on the ground, y up is negative
// one closed outline with rounded corners (five rounded points, rounded valleys)
function roundPoly(g,pts){const n=pts.length;const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];const s=m(pts[n-1],pts[0]);g.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const c=pts[i],nx=m(c,pts[(i+1)%n]);g.arcTo(c[0],c[1],nx[0],nx[1],c[2]);}g.closePath();}
const COMB=[[-80,18,12],[-84,-24,12],[-66,-70,8],[-49,-42,4],[-33,-84,8],[-16,-46,4],[0,-94,8],[16,-46,4],[33,-84,8],[49,-42,4],[66,-70,8],[84,-24,12],[80,18,12]];
function pixComb(g){roundPoly(g,COMB);}
function pixBody(g){g.moveTo(-58,-224);g.lineTo(58,-224);g.quadraticCurveTo(96,-224,98,-182);g.lineTo(106,-82);g.quadraticCurveTo(110,-22,52,-22);g.lineTo(-52,-22);g.quadraticCurveTo(-110,-22,-106,-82);g.lineTo(-98,-182);g.quadraticCurveTo(-96,-224,-58,-224);g.closePath();}
function pixFoot(g,x){
  clay(g,rr(x-12,-44,24,34,9),'#e2741b',{x:x-12,y:-44,w:24,h:34},{rim:.3,hi:.2,ts:.3});
  clay(g,g=>{for(const dx of [-19,0,19]){g.moveTo(x+dx+12,-10);g.ellipse(x+dx,-10,12,10.5,0,0,TAU);}g.moveTo(x+24,-14);g.roundRect(x-27,-22,54,16,8);},'#f28c25',{x:x-31,y:-23,w:62,h:24},{rim:.3,hi:.35,ts:.3});}
function pixWing(g,sd,r){g.save();g.translate(sd*100,-146+(r<0?8*clamp(-r):0));g.rotate(sd<0?r:-r);
  clay(g,ell(0,50,31,56),'#2b2927',{x:-31,y:-6,w:62,h:112},{rim:.55,hi:.2,tex:.95});g.restore();}
function drawPix(g,P){
  const s=P.s, hop=P.hop||0, sq=P.sq||1;
  groundShadow(g,P.x,P.y,120*s*(1-0.35*clamp(hop/140)),0.5*(1-0.5*clamp(hop/140)));
  g.save();g.translate(P.x,P.y-hop);g.rotate(P.rot||0);g.scale(s*sq,s/sq);
  pixFoot(g,-48);pixFoot(g,48);
  g.save();g.translate(0,-214);g.rotate(P.comb||0);clay(g,pixComb,'#d9342b',{x:-76,y:-92,w:152,h:108},{rim:.32,hi:.3,ts:.35});g.restore();
  clay(g,pixBody,'#262422',{x:-110,y:-224,w:220,h:202},{rim:.5,hi:.22,tex:1,bot:.25});
  const fx=(P.ft||0)*24;
  // eyes
  for(const sd of [-1,1]){
    const ex=sd*44+fx*(sd===Math.sign(P.ft||0)?0.8:1.1), ey=-158;
    let w=42,h=36;
    if(P.eye==='wide'){w=46;h=46;} if(P.eye==='squint'){h=22;} if(P.eye==='happy'){h=34;}
    h*=1-(P.blink||0)*0.85;
    clay(g,rr(ex-w/2,ey-h/2,w,h,7),'#bce640',{x:ex-w/2,y:ey-h/2,w,h},{rim:.28,hi:.4,tex:.35,ts:.25});
    if(P.eye==='happy'){g.save();g.strokeStyle='#1c1a17';g.lineWidth=5.5;g.lineCap='round';g.beginPath();g.arc(ex,ey+9,11,Math.PI*1.15,Math.PI*1.85);g.stroke();g.restore();}
    else if(P.eye!=='plain'&&(P.blink||0)<0.6){const pw=P.eye==='wide'?10:12,ph=P.eye==='squint'?9:pw;
      const px=ex+(P.px||0)*(w/2-pw/2-5),py=ey+(P.py||0)*(h/2-ph/2-4);g.fillStyle='#1c1a17';g.beginPath();g.roundRect(px-pw/2,py-ph/2,pw,ph,2.5);g.fill();}
    const b=P.brow||0;
    if(b>0){const up=(P.browUp||[0,0])[sd<0?0:1];g.save();g.translate(ex,ey-h/2-9-(1-b)*14-up*14);g.rotate(-sd*(0.3*b-0.45*up));
      clay(g,rr(-27,-7,54,14,7),'#141312',{x:-27,y:-7,w:54,h:14},{rim:.3,hi:.25,ts:.3});g.restore();}
  }
  // wattle, mouth, beak
  const o=P.beak||0, bx=fx*1.1;
  clay(g,g=>{g.moveTo(bx,-114);g.bezierCurveTo(bx+15,-100,bx+15,-78,bx,-76);g.bezierCurveTo(bx-15,-78,bx-15,-100,bx,-114);g.closePath();},'#d3302a',{x:bx-13,y:-114,w:26,h:38},{rim:.3,hi:.35,ts:.3});
  if(o>0.02){
    g.fillStyle='#3a110b';g.beginPath();g.moveTo(bx-19,-141);g.lineTo(bx+19,-141);g.lineTo(bx+3,-112+14*o);g.lineTo(bx-3,-112+14*o);g.closePath();g.fill();
    const jy=-136+12*o;
    clay(g,g=>{g.moveTo(bx-16,jy);g.lineTo(bx+16,jy);g.quadraticCurveTo(bx+4,jy+22,bx,jy+26);g.quadraticCurveTo(bx-4,jy+22,bx-16,jy);g.closePath();},'#e2721a',{x:bx-16,y:jy,w:32,h:26},{rim:.3,hi:.25,ts:.3});}
  const tip=-108-14*o;
  clay(g,g=>{g.moveTo(bx-25,-145);g.quadraticCurveTo(bx,-152,bx+25,-145);g.quadraticCurveTo(bx+9,-128,bx+2,tip);g.lineTo(bx-2,tip);g.quadraticCurveTo(bx-9,-128,bx-25,-145);g.closePath();},'#f58c22',{x:bx-25,y:-152,w:50,h:-tip-145+152},{rim:.25,hi:.45,ts:.3});
  pixWing(g,-1,P.wL??0.12);pixWing(g,1,P.wR??0.12);
  g.restore();}

// ---------- YOLK: round mustard-yellow clay ball in a cracked cream eggshell ----------
function shellFront(g){const n=7;g.moveTo(-100,-98);
  for(let i=0;i<n;i++){const x1=-100+200*(i+.5)/n,x2=-100+200*(i+1)/n;g.lineTo(x1,-122+(i%2?4:0));g.lineTo(x2,i===n-1?-98:-100);}
  g.bezierCurveTo(104,-38,70,2,0,2);g.bezierCurveTo(-70,2,-104,-38,-100,-98);g.closePath();}
function yolkArm(g,sd,r,inward=0){g.save();g.translate(sd*(80-26*inward),-110);g.rotate(sd<0?r:-r);
  clay(g,ell(0,28,21,30),'#eab128',{x:-21,y:-2,w:42,h:60},{rim:.35,hi:.35,ts:.35});g.restore();}
function drawYolk(g,Y){
  const s=Y.s;
  groundShadow(g,Y.x,Y.y,115*s,0.5);
  g.save();g.translate(Y.x+(Y.dx||0),Y.y);g.rotate(Y.rot||0);g.scale(s,s);
  clay(g,ell(0,-104,96,22),'#d8c7a2',{x:-96,y:-126,w:192,h:44},{rim:.3,hi:.1,tex:.4});
  g.save();g.translate(0,-(Y.bob||0));
  clay(g,ell(0,-160,92,94),'#ebb22a',{x:-92,y:-254,w:184,h:188},{rim:.36,hi:.34,tex:.65,bot:.15});
  const fx=(Y.ft||0)*26, ch=Y.cheek||0;
  for(const sd of [-1,1]){const cx=fx+sd*54;clay(g,ell(cx,-142,15+4*ch,11+3*ch),ch>0.5?'#f2826e':'#ee9a7f',{x:cx-19,y:-156,w:38,h:28},{rim:.15,hi:.25,tex:.3,ts:.25});}
  g.fillStyle='#2b1a10';g.strokeStyle='#2b1a10';g.lineCap='round';g.lineWidth=5.5;
  for(const sd of [-1,1]){const ex=fx+sd*29,ey=-172;
    if(Y.eyes==='happy'){g.beginPath();g.arc(ex,ey+5,9,Math.PI*1.15,Math.PI*1.85);g.stroke();}
    else{const bl=1-(Y.blink||0)*0.85;g.beginPath();g.ellipse(ex+(Y.px||0)*4,ey+(Y.py||0)*3,7,7.5*bl,0,0,TAU);g.fill();}}
  const m=Y.mouth||0; // 0 closed smile, 1 open smile, 2 big laugh
  if(m<0.15){g.beginPath();g.arc(fx,-160,19,0.18*Math.PI,0.82*Math.PI);g.stroke();}
  else{const w=16+8*m,h=10+12*m,my=-150;g.save();g.beginPath();g.moveTo(fx-w,my);g.quadraticCurveTo(fx,my-4,fx+w,my);g.quadraticCurveTo(fx+w*0.9,my+h,fx,my+h);g.quadraticCurveTo(fx-w*0.9,my+h,fx-w,my);g.closePath();
    g.fillStyle='#55200f';g.fill();g.clip();g.fillStyle='#ec7f6c';g.beginPath();g.ellipse(fx,my+h+2,w*0.62,h*0.55,0,0,TAU);g.fill();g.restore();}
  g.restore();
  clay(g,shellFront,'#efe4c8',{x:-102,y:-124,w:204,h:126},{rim:.32,hi:.32,tex:.55});
  g.save();g.strokeStyle='rgba(255,255,255,0.35)';g.lineWidth=2.5;g.lineJoin='round';g.beginPath();const n=7;g.moveTo(-98,-99);for(let i=0;i<n;i++){g.lineTo(-100+200*(i+.5)/n,-121+(i%2?4:0));g.lineTo(-100+200*(i+1)/n,-99);}g.stroke();g.restore();
  yolkArm(g,-1,Y.rL??0.25,Y.inL||0);yolkArm(g,1,Y.rR??0.25,Y.inR||0);
  g.restore();}

// dust puffs from the skid (small cream clay balls)
function puffs(g,t,x,y){for(let i=0;i<6;i++){const t0=2.95+i*0.1,u=(t-t0)/0.75;if(u<0||u>1)continue;const r=(7+5*(i%3))*Math.sin(Math.PI*u);
  clay(g,ell(x-30-i*16-u*30,y-6-u*30-(i%2)*10,r,r),'#f3e6c6',{x:x-60,y:y-60,w:60,h:60},{rim:.25,hi:.3,tex:.4,ts:.3});}}

// ---------- shots ----------
const groundY=(d,k=1)=>deskY(d,k);
const PIX0={s:0.78,eye:'normal',wL:0.12,wR:0.12};
const YOLK0={s:0.66,rL:0.25,rR:0.25,eyes:'dots',mouth:0,cheek:0.3};
const breathe=(t,a=0.012,f=0.8)=>1+a*Math.sin(TAU*f*t);
const blinkAt=(t,list)=>{for(const b of list){const u=(t-b)/0.17;if(u>=0&&u<=1)return Math.sin(Math.PI*u);}return 0;};

function shot1(t,fi){ // 0-5 static medium: Pix hops in panicked, skids next to the pink notes; Yolk calm
  const k=1;
  const P={...PIX0,y:groundY(0.3),eye:'wide',beak:0.65+0.25*(fi%2)};
  const hops=[[0.25,-180,-40],[0.9,-40,90],[1.55,90,200],[2.2,200,290]],D=0.65;
  let x=-180,hop=0,air=false,land=0;
  for(const [t0,a,b] of hops){if(t>=t0){const u=clamp((t-t0)/D);x=lerp(a,b,u);hop=125*4*u*(1-u);air=u>0.1&&u<0.9;if(u>=1)land=t-(t0+D);}}
  const sk=sm(t,2.85,3.5); if(t>=2.85){x=lerp(290,350,out(seg(t,2.85,3.5)));hop=0;}
  P.x=x;P.hop=hop;P.sq=air?0.9:(t<2.85&&hop<20?1.12:1);
  P.rot=t<2.85?0.13:-0.24*(1-spring(t,3.35,1.8,0.32));
  const flap=fi%2?1.35:0.35;
  P.wL=P.wR=t<2.85?(air?flap:0.6):lerp(1.0,0.12,sm(t,3.4,4.2));
  if(t>3.5){P.sq=1+0.035*Math.sin(TAU*2.4*t);P.beak=lerp(0.55,0.25,seg(t,3.5,4.6))+0.12*(fi%2);}
  P.comb=0.18*Math.sin(TAU*1.6*t)*Math.exp(-Math.max(0,t-3.4)*1.2);
  P.ft=lerp(0,0.4,sm(t,4.1,4.5));P.px=lerp(0,0.8,sm(t,4.1,4.4));
  P.blink=blinkAt(t,[4.7]);
  const Y={...YOLK0,x:880,y:groundY(0.3),rot:0.03*Math.sin(TAU*0.5*t),px:lerp(0,-0.9,sm(t,1.0,1.3)),ft:lerp(0,-0.25,sm(t,1.0,1.4)),blink:blinkAt(t,[3.9]),cheek:0.35};
  return {cam:{z:1.2,cx:540,cy:1110},k,blur:1.5,pix:P,yolk:Y,fx:g=>puffs(g,t,P.x,P.y)};
}
function shot2(t,fi){ // 5-9 slow push-in toward Yolk: big warm wave, rosy cheeks; Pix watches from the left
  const u=t-5;
  const z=lerp(1.2,1.5,io(seg(u,0,4)));
  const P={...PIX0,x:350,y:groundY(0.3),sq:breathe(t,0.015,1.1),eye:'normal',ft:0.4,px:0.8,blink:blinkAt(u,[2.3]),beak:0};
  const raise=springKeys(u,[[0,0.25],[0.3,2.55],[3.4,1.9]],2.2,0.5);
  const wave=u>0.7&&u<3.5?0.38*Math.sin(TAU*2.4*(u-0.7)):0;
  const Y={...YOLK0,x:880,y:groundY(0.3),rR:raise+wave,rL:0.25+0.1*seg(u,0.3,0.6),mouth:lerp(0,1,sm(u,0.3,0.6)),cheek:lerp(0.35,1,sm(u,0.3,1.3)),
    rot:0.05*Math.sin(TAU*1.2*u),ft:-0.15,px:-0.3,bob:3*Math.sin(TAU*1.2*u)};
  return {cam:{z,cx:lerp(540,675,io(seg(u,0,4))),cy:lerp(1110,1135,io(seg(u,0,4)))},k:1,blur:lerp(1.5,3,seg(u,0,4)),pix:P,yolk:Y};
}
function shot3(t,fi){ // 9-13 close-up: Pix leans in, squints, wing to chin
  const u=t-9;
  const lean=spring(u,0.25,1.6,0.55);
  const P={...PIX0,x:350,y:groundY(0.3)+10*lean,s:0.78*(1+0.1*lean),rot:-0.05*lean,eye:u<0.5?'normal':'squint',brow:sm(u,0.45,0.9),
    wL:springKeys(u,[[0,0.12],[0.55,-0.9]],2,0.5),wR:0.12,
    px:easeKeys(u,[[0,0],[1.2,0],[1.5,-0.85],[2.2,-0.85],[2.5,0.85],[3.2,0.85],[3.45,0]]),
    browUp:[0,sm(u,2.6,2.85)*(1-sm(u,3.5,3.8))],sq:breathe(t,0.01,0.7),comb:-0.06*lean+0.04*Math.sin(TAU*0.9*u)};
  const Y={...YOLK0,x:880,y:groundY(0.3)};
  return {cam:{z:4.1,cx:350,cy:groundY(0.3)-128},k:1,blur:11,pix:P,yolk:Y};
}
function shot4(t,fi){ // 13-19 Yolk laughs, shaking side to side, both arms up; Pix at the left edge
  const u=t-13;
  const on=sm(u,0.1,0.45)*(1-sm(u,5.2,5.8));
  const shake=Math.sin(TAU*2*u)*on;
  const Y={...YOLK0,x:880,y:groundY(0.3),rot:0.1*shake,dx:6*shake,bob:6*Math.abs(Math.sin(TAU*2*u))*on,
    eyes:on>0.3?'happy':'dots',mouth:lerp(0.6,2,on),cheek:1,
    rL:lerp(0.3,2.25,on)+0.25*Math.sin(TAU*2*u+1)*on,rR:lerp(0.3,2.25,on)+0.25*Math.sin(TAU*2*u)*on};
  const P={...PIX0,x:655,y:groundY(0.3),eye:'normal',ft:0.4,px:0.85,sq:breathe(t,0.015,1),beak:0.15*sm(u,2.5,3)*(1-sm(u,4.5,5)),blink:blinkAt(u,[1.9,4.1])};
  return {cam:{z:2.55,cx:870,cy:1085},k:1,blur:6,pix:P,yolk:Y};
}
function shot5(t,fi){ // 19-24 low angle: Pix fist-pumps with a tiny bounce, comb wobbles; Yolk claps
  const u=t-19,k=0.42;
  const ant=sm(u,0.15,0.45)*(1-seg(u,0.45,0.55));
  const pump=spring(u,0.5,2,0.45);
  const bounce=u>0.5?32*Math.abs(Math.sin(Math.PI*(u-0.5)/0.42))*Math.exp(-(u-0.5)*0.9):0;
  const P={...PIX0,x:440,y:groundY(0.13,k),s:0.8,eye:u<0.45?'normal':'happy',beak:u<0.45?0:0.85-0.25*(fi%2)*seg(u,1,4),
    sq:1+0.12*ant-0.05*clamp(bounce/30),hop:bounce,wR:-0.2*ant+2.75*pump+(u>1.2?0.22*Math.sin(TAU*2*(u-1.2)):0),wL:0.12+0.35*pump,
    comb:0.22*Math.sin(TAU*2.3*(u-0.5))*Math.exp(-Math.max(0,u-0.5)*0.9)*(u>0.5?1:0),rot:-0.04*pump};
  const c=u>0.6&&u<4.4?(Math.floor((u-0.6)*6)%2===0?1:0):0;
  const Y={...YOLK0,x:720,y:groundY(0.13,k),s:0.68,eyes:'happy',mouth:1.3,cheek:1,rL:c?-1.45:-0.2,rR:c?-1.45:-0.2,inL:c?1:0.3,inR:c?1:0.3,
    bob:c?2:5,rot:0.03*Math.sin(TAU*1.5*u)};
  if(u<0.6){Y.rL=Y.rR=lerp(0.25,-0.2,seg(u,0.3,0.6));Y.eyes='dots';Y.mouth=lerp(0.3,1.3,seg(u,0.3,0.6));Y.inL=Y.inR=0;}
  return {cam:{z:1.85,cx:575,cy:1040},k,blur:5,pix:P,yolk:Y};
}
function shot6(t,fi){ // 24-30 side by side, both turn to camera, Yolk tilts; slow push-in
  const u=t-24;
  const turnP=spring(u,0.9,1.6,0.6),turnY=spring(u,1.25,1.6,0.6);
  const P={...PIX0,x:448,y:groundY(0.15),eye:'normal',ft:0.4*(1-turnP),px:0.85*(1-turnP),py:-0.1*turnP,sq:breathe(t,0.012,0.8),
    rot:-0.05*spring(u,2.2,1.4,0.55),comb:0.05*Math.sin(TAU*1.4*(u-2.2))*Math.exp(-Math.max(0,u-2.2))*(u>2.2?1:0),blink:blinkAt(u,[3.3,5.2]),beak:0.12*sm(u,2.4,2.8)};
  const Y={...YOLK0,x:655,y:groundY(0.15),ft:-0.35*(1-turnY),px:-0.9*(1-turnY),mouth:0.5*sm(u,1.6,2),cheek:0.8,
    rot:0.15*spring(u,1.9,1.3,0.55),blink:blinkAt(u,[3.9]),bob:2*Math.sin(TAU*0.7*u)};
  const z=lerp(1.6,2.15,io(seg(u,0,6)));
  return {cam:{z,cx:552,cy:lerp(1085,1100,seg(u,0,6))},k:1,blur:lerp(3,5,seg(u,0,6)),pix:P,yolk:Y};
}
const SHOTS=[[0,shot1],[5,shot2],[9,shot3],[13,shot4],[19,shot5],[24,shot6]];

// ---------- render ----------
function setCam(g,c){g.setTransform(1,0,0,1,0,0);g.translate(W/2,H/2);g.scale(c.z,c.z);g.translate(-c.cx,-c.cy);}
function backdrop(g){g.setTransform(1,0,0,1,0,0);const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#cdff52');gr.addColorStop(0.55,LIME);gr.addColorStop(1,'#b6ef2f');g.fillStyle=gr;g.fillRect(0,0,W,H);}
window.seek=async function(t){
  t=clamp(t,0,T-1e-4);
  const fi=Math.floor(t*SFPS+1e-6), tq=fi/SFPS;
  let S=SHOTS[0];for(const s of SHOTS)if(tq>=s[0])S=s;
  const st=S[1](tq,fi);
  const r=mulberry32(9001+fi*7919);
  TJ={x:(r()-0.5)*6,y:(r()-0.5)*6};
  // set layer (shallow depth of field: blurred behind the characters)
  backdrop(bctx);setCam(bctx,st.cam);drawSet(bctx,st.k);
  ctx.setTransform(1,0,0,1,0,0);backdrop(ctx);
  ctx.filter=`blur(${st.blur}px)`;ctx.drawImage(bg,0,0);ctx.filter='none';
  setCam(ctx,st.cam);
  const j=1.2/st.cam.z;
  const P={...st.pix,x:st.pix.x+(r()-0.5)*j,rot:(st.pix.rot||0)+(r()-0.5)*0.006};
  const Y={...st.yolk,x:st.yolk.x+(r()-0.5)*j,rot:(st.yolk.rot||0)+(r()-0.5)*0.006};
  cctx.setTransform(1,0,0,1,0,0);cctx.clearRect(0,0,W,H);setCam(cctx,st.cam);
  if(st.fx)st.fx(cctx);
  drawYolk(cctx,Y);drawPix(cctx,P);
  // hand-shaped outlines: low-frequency displacement whose seed changes every pose (clay "boil")
  ctx.setTransform(1,0,0,1,0,0);ctx.filter=`url(#boil${fi%3})`;ctx.drawImage(ch,0,0);ctx.filter='none';
  // lens + film: soft vignette, per-pose light flicker, grain
  ctx.setTransform(1,0,0,1,0,0);
  const vg=ctx.createRadialGradient(W/2,H*0.48,H*0.3,W/2,H/2,H*0.75);vg.addColorStop(0,'rgba(20,40,0,0)');vg.addColorStop(1,'rgba(20,40,0,0.22)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const fl=(r()-0.5)*0.03;ctx.fillStyle=fl>0?`rgba(255,250,235,${fl})`:`rgba(0,0,0,${-fl})`;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.07;ctx.drawImage(GRAIN[fi%GRAIN.length],0,0,W,H);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  document.getElementById('hud').textContent=`t ${t.toFixed(2)}  pose ${fi}`;
};

// ---------- init + preview controls (Space play/pause, arrows step a pose, R replay) ----------
TEX=makeTex(42);texPat=ctx.createPattern(TEX,'repeat');
for(let i=0;i<4;i++)GRAIN.push(makeGrain(100+i));
window.seek(0);window.ready=true;
if(location.search.includes('preview')){document.body.classList.add('preview');let playing=false,t0=0,tc=0;
  const loop=now=>{if(!playing)return;tc=(now-t0)/1000;if(tc>=T){tc=T-1e-3;playing=false;}window.seek(tc);requestAnimationFrame(loop);};
  addEventListener('keydown',e=>{if(e.code==='Space'){playing=!playing;if(playing){t0=performance.now()-tc*1000;requestAnimationFrame(loop);}}
    if(e.code==='ArrowRight'){tc=Math.min(T,tc+1/SFPS);window.seek(tc);}if(e.code==='ArrowLeft'){tc=Math.max(0,tc-1/SFPS);window.seek(tc);}
    if(e.code==='KeyR'){tc=0;t0=performance.now();playing=true;requestAnimationFrame(loop);}});}
</script>
